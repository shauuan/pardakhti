name: pardakhti
description: نرم‌افزار حقوق و دستمزد دسکتاپ — پرداختی
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  window_manager: ^0.4.3
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  shamsi_date: ^1.0.4
  intl: ^0.20.2

  # دیتابیس SQLite با migration
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3: ^2.7.5
  path_provider: ^2.1.5
  path: ^1.9.1

  # هش رمز عبور
  crypto: ^3.0.6

  # ایمپورت/اکسپورت
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^8.3.7

  # فیش و گزارش PDF
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
