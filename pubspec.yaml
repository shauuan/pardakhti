name: pardakhti
description: نرم‌افزار حقوق و دستمزد دسکتاپ — پرداختی
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # آیکون‌های Material
  cupertino_icons: ^1.0.8

  # مدیریت state یکدست در کل اپ
  flutter_riverpod: ^2.6.1

  # ناوبری declarative و deep-link پذیر
  go_router: ^14.8.1

  # کنترل اندازه/موقعیت پنجره ویندوز
  window_manager: ^0.4.3

  # نمودار داشبورد
  fl_chart: ^0.70.2

  # انیمیشن‌های ظریف UI
  flutter_animate: ^4.5.2

  # تاریخ شمسی (نمایش و محاسبات روز ماه)
  shamsi_date: ^1.0.4

  # قالب‌بندی اعداد و locale
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
